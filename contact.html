<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Perfuma | Contact</title>
</head>
<body class="page-contact">
    <header class="site-header">
        <div class="container header-row">
            <div>
                <a class="brand" href="index.html">Perfuma</a>
            </div>
            <nav class="site-nav">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main class="section container">
        <div class="section-header">
            <p class="eyebrow">Get in touch</p>
            <h2>Questions? We’re here to help.</h2>
        </div>
        <div class="contact-grid">
            <div class="contact-card">
                <h3>Contact information</h3>
                <p>Email: perfumacorp@gmail.com</p>
                <p>Phone: +1 (555) 123-4567</p>
                <p>Address: 123 Scent Lane, France</p>
            </div>
            <form class="contact-form" action="#" method="post">
                <label>
                    Name
                    <input type="text" name="name" placeholder="Your name">
                </label>
                <label>
                    Email
                    <input type="email" name="email" placeholder="you@example.com">
                </label>
                <label>
                    Message
                    <textarea name="message" rows="5" placeholder="Write your message"></textarea>
                </label>
                <button class="button button-primary" type="submit">Send Message</button>
            </form>
        </div>
    </main>

    <footer class="site-footer container">
        <p>© 2026 Perfuma. Reach out anytime.</p>
    </footer>
</body>
</html>
